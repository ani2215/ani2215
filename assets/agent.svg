<svg xmlns="http://www.w3.org/2000/svg" width="420" height="220" viewBox="0 0 420 220">
<style>
text{font-family:'JetBrains Mono','Fira Code',Consolas,Menlo,monospace}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}} .bot{animation:hover 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{r:5;opacity:1}50%{r:9;opacity:.4}} .ant{animation:pulse 1.2s infinite}
@keyframes eyes{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.15)}} .ey{animation:eyes 3.5s infinite;transform-origin:center;transform-box:fill-box}
@keyframes type{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}} .hl{animation:type .25s infinite} .hr{animation:type .25s .12s infinite}
@keyframes rows{0%{opacity:0;transform:translateX(-6px)}20%,100%{opacity:1;transform:none}}
.r1{animation:rows 4s infinite} .r2{animation:rows 4s .6s infinite backwards} .r3{animation:rows 4s 1.2s infinite backwards}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(14px,-26px)}} .z{animation:zz 3s infinite} .z2{animation:zz 3s 1s infinite}
</style>
<rect x="1" y="1" width="418" height="218" rx="14" fill="#05010f" stroke="#FF2BD6" stroke-opacity=".6"/>
<g class="bot">
  <line x1="95" y1="38" x2="95" y2="54" stroke="#00F0FF" stroke-width="3"/>
  <circle class="ant" cx="95" cy="34" r="5" fill="#FF2BD6"/>
  <rect x="55" y="54" width="80" height="58" rx="14" fill="#160b2e" stroke="#00F0FF" stroke-width="2.5"/>
  <rect class="ey" x="72" y="74" width="14" height="14" rx="3" fill="#00F0FF"/>
  <rect class="ey" x="104" y="74" width="14" height="14" rx="3" fill="#00F0FF"/>
  <path d="M82 100 q13 8 26 0" stroke="#FF2BD6" stroke-width="3" fill="none" stroke-linecap="round"/>
  <rect x="62" y="116" width="66" height="40" rx="10" fill="#160b2e" stroke="#00F0FF" stroke-width="2.5"/>
  <text x="95" y="141" text-anchor="middle" fill="#FCEE0A" style="font-size:11px;font-weight:700">AI</text>
</g>
<rect x="40" y="168" width="110" height="10" rx="3" fill="#2a1a4a"/>
<rect class="hl" x="56" y="158" width="18" height="10" rx="3" fill="#00F0FF"/>
<rect class="hr" x="116" y="158" width="18" height="10" rx="3" fill="#00F0FF"/>
<rect x="180" y="40" width="216" height="118" rx="10" fill="#0d0620" stroke="#2a1a4a"/>
<text x="192" y="62" fill="#8a7fb0" style="font-size:11px">agent.log</text>
<text class="r1" x="192" y="88" fill="#39FF14" style="font-size:12px">✔ wrote 47 SQL queries</text>
<text class="r2" x="192" y="112" fill="#39FF14" style="font-size:12px">✔ cleaned 1.2M rows</text>
<text class="r3" x="192" y="136" fill="#00F0FF" style="font-size:12px">✔ built the dashboard</text>
<text class="z" x="330" y="190" fill="#FCEE0A" style="font-size:14px">🎮</text>
<text class="z2" x="352" y="186" fill="#FCEE0A" style="font-size:12px">z</text>
<text x="210" y="200" text-anchor="middle" fill="#8a7fb0" style="font-size:12px">my AI agent working while I play Xbox</text>
</svg>